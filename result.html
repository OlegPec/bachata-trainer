<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bachata Trainer — Результат экзамена</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#322947,#10121a 58%);color:#f7f6fb;font:16px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:750px;margin:0 auto;padding:26px 17px 55px}a{color:#d3baff}h1{font-size:clamp(24px,4vw,36px)}h2{font-size:22px}.card{background:#1b2030;border:1px solid #353c50;padding:24px;border-radius:20px;margin:16px 0}.muted{color:#aab4c9}.score{text-align:center;font-size:clamp(55px,13vw,88px);font-weight:800;letter-spacing:-.065em;color:#50dcae}.score small{font-size:20px;color:#b0bad0;letter-spacing:0}.track{background:#111625;border:1px solid #353a49;border-radius:14px;padding:15px;margin:10px 0}.track-title{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;font-weight:750}.track-score{font-size:24px;color:#9af0d0}.bar{height:8px;background:#2e3446;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#7656cc,#c5acff);border-radius:99px}.mini{font-size:12px;color:#aab4c9}.error{color:#ffb0ba}button{background:#aa90ff;border:0;border-radius:10px;padding:11px 16px;color:#191425;font:inherit;cursor:pointer;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
</style></head><body><main><div class="top"><h1>🎵 Bachata Trainer</h1><a href="exam.html">Пройти экзамен</a></div>
<div id="error" class="card error" hidden></div>
<section id="content" class="card" hidden><p class="muted" style="text-align:center">Результат экзамена</p><div class="score" id="score"></div><p id="date" class="muted" style="text-align:center"></p><h2>По песням</h2><div id="tracks"></div>
<p class="mini">Результат встроен в ссылку как закодированный JSON. Серверная база не используется. Данные можно изменить, поэтому эта страница не подтверждает подлинность результата.</p>
<button id="copy">Скопировать ссылку</button><p id="copyStatus" class="mini"></p></section></main>
<script src="result-codec.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);
function render(){try{
  const params=new URLSearchParams(location.hash.slice(1));const encoded=params.get('r');if(!encoded)throw Error('В адресе нет результата. Открой ссылку, полученную после экзамена.');
  const result=window.BachataResultCodec.decode(encoded);
  const total=result.tracks.reduce((s,t)=>s+t.score,0),max=result.tracks.length*1000;
  $('score').textContent=total+' / '+max;
  const dt=new Date(result.date);$('date').textContent=Number.isNaN(dt.valueOf())?'Дата неизвестна':dt.toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short'});
  $('tracks').replaceChildren();result.tracks.forEach(t=>{
    const c=document.createElement('div');c.className='track';const r=document.createElement('div');r.className='track-title';const title=document.createElement('span');title.textContent=t.title;
    const score=document.createElement('span');score.textContent=t.score+' / 1000';score.className='track-score';r.append(title,score);
    const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=(100*t.score/1000)+'%';bar.append(fill);
    const extra=document.createElement('div');extra.className='mini';extra.textContent='Успешных серий: '+t.completed+' · Сброшено: '+(Number.isInteger(t.failed)?t.failed:0)+' · Неточных нажатий: '+(Number.isInteger(t.extra)?t.extra:0)+(Number.isFinite(t.accuracyMs)?' · Средняя ошибка: '+t.accuracyMs+' мс':'');
    c.append(r,bar,extra);$('tracks').append(c);
  });$('content').hidden=false;
 }catch(e){$('error').hidden=false;$('error').textContent='Не удалось открыть результат: '+e.message;}}
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);$('copyStatus').textContent='Ссылка скопирована!';}catch(_){$('copyStatus').textContent='Скопируй адрес из строки браузера.';}});
render();
</script></body></html>
